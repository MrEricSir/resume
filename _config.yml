# Site settings
title: "Eric Gregory's Resume"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Eric Gregory"
resume_title:                   "Senior Software Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "eric.paul.gregory@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone:       "555-7334"
# resume_contact_address:         "742 Evergreen Terrace, Springfield"

resume_header_contact_info:     "<p>San Francisco, California | <a href='mailto:eric.paul.gregory@gmail.com'>eric.paul.gregory@gmail.com</a></p>
<p>Full Stack | Python | JavaScript | C++ | Browser Engine Integrations | Agile</p>"
display_header_contact_info:    "true"

resume_header_intro: "<p>When was the last time you used software that was so seamless, you didn't know you were using it? I believe software should feel like magic and its users should love it, not just tolerate it.</p>

<p>Some of my specialties:</p>
<ul style=\"list-style-type: '✓ ';\">
  <li>Backends powered by Python, Postgres, and Docker
  <li>C++ and Qt for embedded Linux and cross-platform desktop
  <li>Unit and integration testing
  <li>AI-assisted coding via Claude Code
  <li>Mentorship of junior engineers and interns</p>
</ul>

<p>Available to work in San Francisco or remote.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    true
resume_section_interests:       false

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/MrEricSir/"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/eric-p-gregory/"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "https://mrericsir.github.io/"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
